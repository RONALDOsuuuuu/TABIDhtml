<html>
    <body>
        <section>
            <img class="mySlider" src="aldabratortoise-001.jpg" style="height: 500px;">
             <img class="mySlider" src="images.jpg" style="height: 500px;">
             <img class="mySlider" src="247db7d0dd656f8de9f1ad6e03bce004.jpg" style="height: 500px;">
        </section>
        <script>
            // Automatic slideshow - image every 3 second 
            var myIndex = 0
            carousel();
            function carousel() {
                var i;
                var x = document.getElementsByClassName("mySlides")
                for (i = 0; i < x.length; i++) {
                    x[i].style.display = "none";
                }
                myIndex++;
                if (myIndex > x.length) {myIndex = 1}
                x[myIndex-1].style.display = "block";
                setTimeout(carousel, 3000);
            }
        </script>
    </body>
</html>
