<HTml>
    <head>
        <title>Make Changes to the Rectangle</title>
        <style>
h2 {
    text-align: center;
}
.rectangle{
    border: 1px solid black;
    width: 200px;
    height: 200px;
    margin: auto;
}
.buttens {
    padding: 20px;
     width: 200px;
    height: 200px;
    text-align: center;
}
        </style>
    </head>
    <body>
        <h2>Make Changes to the Rectangle</h2>
        <div class="rectangle"></div>
        <div class="buttens">
<button onclick="changeToCircle()">Make circle</button>
<button onclick="hideRect()">Hide</button>
<button onclick="showRect()">Show</button>
        </div>
        <script>
            let div = document.quarySelector(".rectangle")
            function changeToCircle() {
                div.style.borderRadius = "50%";
            }
             function hideRect() {
                div.style.display = "none";
            }
            
            function showRect() {
                div.style.display = "block";
            }
            div.onmouseenter = function () {
                 div.style.bacground = "green";
            };
            div.onmouseleave = function () {
                 div.style.bacground = "blue";
            };
        </script>
    </body>
</HTml>
